<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #69737AF2;
    color: #ffffff;
  }

  /* Navigation */
  header {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    background: #69737AF2;
    border-bottom: 1px solid rgba(223, 214, 214, 0.1);
    padding: 1.5rem 3rem;
  }

  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1400px;
    margin: 0 auto;
  }

  .logo {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #b0b0b0;
    transition: color 0.3s ease;
    position: relative;
    outline: none;
    user-select: none;
  }

  .logo:hover {
    color: #812c12;
  }

  .logo::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 0;
    width: 0;
    height: 2px;
    background: #812c12;
    transition: width 0.3s ease;
  }

  .logo:hover::after {
    width: 100%;
  }

    .nav-links {
    display: flex;
    gap: 3rem;
    list-style: none;
    align-items: center;
  }

  .nav-links a {
    text-decoration: none;
    color: #b0b0b0;
    font-size: 0.95rem;
    transition: color 0.3s ease;
    position: relative;
    outline: none;
    user-select: none;
  }

  .nav-links a:hover {
    color: #812c12;
  }

  .nav-links a.active {
    color: #812c12;
  }

  .nav-links a.active::after {
    width: 100%;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 2px;
    background: #812c12;
    transition: width 0.3s ease;
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  .search-icon {
    font-size: 1.2rem;
    color: #812c12;
    cursor: pointer;
    transition: color 0.3s ease;
  }

  .search-icon:hover {
    color: #b0b0b0;
  }

  /* Hero Section */
  .hero-container {
    background-image: url('./assets/images/ako(2).png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 80px;
    position: relative;
  }

  .hero-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1;
  }

  .hero-content {
    padding: 3rem;
    text-align: center;
    position: relative;
    z-index: 2;
    max-width: 800px;
  }

  .hero-subtitle {
    color: #b0b0b0;
    font-size: 1.5rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 1rem;
    font-weight: 500;

  }

  .hero-title {
    font-size: 4rem;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 2rem;
    color: #69737AF2;
    transition: all 0.5s ease;
    animation: slideInTitle 0.8s ease-out;
  }

  @keyframes slideInTitle {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .hero-description {
    color: #b0b0b0;
    font-size: 1.5rem;
    line-height: 1.6;
    margin-bottom: 2.5rem;
    max-width: 500px;
  }

  .hero-actions {
    display: flex;
    gap: 2rem;
    align-items: center;
    margin-bottom: 2rem;
  }

  .hero-image {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(255, 193, 7, 0.2);
  }

  .image-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.4) 0%, rgba(255,193,7,0.1) 100%);
    border-radius: 8px;
    pointer-events: none;
  }

  .scroll-indicator {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    color: #b0b0b0;
    font-size: 2rem;
    z-index: 999;
    animation: bounce 1.5s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* Responsive */
  @media (max-width: 768px) {
    header {
      padding: 1rem 1.5rem;
    }

    .nav-links {
      gap: 1.5rem;
    }

    .hero-container {
      grid-template-columns: 1fr;
      margin-top: 100px;
    }

    .hero-title {
      font-size: 2.5rem;
    }

    .hero-actions {
      flex-direction: column;
      align-items: flex-start;
    }

    .scroll-indicator {
      display: none;
    }
  }

</style>
</head>
