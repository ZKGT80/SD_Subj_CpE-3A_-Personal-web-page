<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #69737AF2;
    color: #ffffff;
  }

  /* Navigation */
  header {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    background: #69737AF2;
    border-bottom: 1px solid rgba(223, 214, 214, 0.1);
    padding: 1.5rem 3rem;
  }

  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1400px;
    margin: 0 auto;
  }

  .logo {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #b0b0b0;
    transition: color 0.3s ease;
    position: relative;
    outline: none;
    user-select: none;
  }

  .logo:hover {
    color: #812c12;
  }

  .logo::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 0;
    width: 0;
    height: 2px;
    background: #812c12;
    transition: width 0.3s ease;
  }

  .logo:hover::after {
    width: 100%;
  }

    .nav-links {
    display: flex;
    gap: 3rem;
    list-style: none;
    align-items: center;
  }

  .nav-links a {
    text-decoration: none;
    color: #b0b0b0;
    font-size: 0.95rem;
    transition: color 0.3s ease;
    position: relative;
    outline: none;
    user-select: none;
  }

  .nav-links a:hover {
    color: #812c12;
  }

  .nav-links a.active {
    color: #812c12;
  }

  .nav-links a.active::after {
    width: 100%;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 2px;
    background: #812c12;
    transition: width 0.3s ease;
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  .search-icon {
    font-size: 1.2rem;
    color: #812c12;
    cursor: pointer;
    transition: color 0.3s ease;
  }

  .search-icon:hover {
    color: #b0b0b0;
  }

  .gallery-section {
    background: #1e2124f2;
    padding: 5rem 2rem;
    min-height: 100vh;
    margin-top: 80px;
  }

  .gallery-container {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  .gallery-title {
    font-size: 3rem;
    font-weight: 700;
    color: #812c12;
    margin-bottom: 3rem;
    text-align: center;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1.5rem;
  }

  .gallery-item {
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    overflow: hidden;
  }

  .gallery-frame {
    min-height: 240px;
    background: rgba(255, 255, 255, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 1rem;
    overflow: hidden;
  }

  .gallery-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 14px;
    display: block;
  }

  .gallery-frame::before {
    content: "";
    position: absolute;
    inset: 1rem;
    border: 2px dashed rgba(255, 255, 255, 0);
    border-radius: 16px;
    pointer-events: none;
  }

  .gallery-caption {
    padding: 1rem 1.2rem 1.4rem;
    color: #ffffff;
    font-size: 1.1rem;
    line-height: 1.6;
    text-align: center;
  }

  @media (max-width: 1024px) {
    .gallery-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 768px) {
    header {
      padding: 1rem 1.5rem;
    }

    .nav-links {
      gap: 1.5rem;
    }

    .gallery-title {
      font-size: 2rem;
    }
  }

</style>
</head>
